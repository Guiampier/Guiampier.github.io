<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador Minecraft - Diseño Mejorado</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #3498db;
            --dark: #1a1a2e;
            --darker: #16213e;
            --light: #ecf0f1;
            --accent: #f39c12;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--darker), var(--dark));
            color: var(--light);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }
        
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: rgba(26, 26, 46, 0.8);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        header {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--accent);
        }
        
        h1 {
            font-family: 'Press Start 2P', cursive;
            color: white;
            margin: 0;
            font-size: 2rem;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }
        
        .tagline {
            font-style: italic;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .panel {
            background-color: rgba(30, 30, 46, 0.6);
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .panel-title {
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .panel-title svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            background-color: rgba(45, 45, 66, 0.8);
            color: white;
            border: 2px solid rgba(85, 85, 85, 0.3);
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            min-height: 150px;
            font-size: 16px;
            margin-bottom: 20px;
            resize: vertical;
            transition: all 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.3);
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-grow: 1;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        
        .color-display {
            background-color: rgba(37, 37, 53, 0.8);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: bold;
            min-height: 80px;
            word-break: break-all;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 5px;
        }
        
        .letter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }
        
        .letter-box {
            background-color: rgba(30, 30, 46, 0.8);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .letter-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .letter {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .color-preview {
            width: 100%;
            height: 25px;
            margin: 0 auto 8px;
            border-radius: 4px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);
        }
        
        .color-code {
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
            word-break: break-all;
        }
        
        .format-info {
            background-color: rgba(30, 30, 46, 0.8);
            border-radius: 10px;
            padding: 20px;
            margin-top: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .format-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .format-table th {
            background-color: rgba(52, 152, 219, 0.2);
            text-align: left;
            padding: 12px;
            font-weight: 600;
        }
        
        .format-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .format-table tr:last-child td {
            border-bottom: none;
        }
        
        /* Efectos especiales */
        @keyframes obfuscate {
            0% { opacity: 0.5; letter-spacing: 0.2em; }
            50% { opacity: 1; letter-spacing: 0.3em; }
            100% { opacity: 0.5; letter-spacing: 0.2em; }
        }
        
        .obfuscated {
            font-family: 'Courier New', monospace;
            animation: obfuscate 0.3s infinite;
            display: inline-block;
            background: rgba(0, 0, 0, 0.2);
            padding: 0 5px;
            border-radius: 3px;
        }
        
        .strikethrough {
            text-decoration: line-through;
            position: relative;
        }
        
        .underline {
            text-decoration: underline;
            text-decoration-color: currentColor;
            text-decoration-thickness: 2px;
        }
        
        .italic {
            font-style: italic;
        }
        
        /* Efecto de carga */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .panel {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        .panel:nth-child(2) {
            animation-delay: 0.1s;
        }
        
        /* Scroll personalizado */
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>MINECRAFT FORMAT VIEWER</h1>
            <div class="tagline">Visualiza tus códigos de formato como en el juego</div>
        </header>
        
        <div class="main-content">
            <div class="panel">
                <h2 class="panel-title">
                    <svg viewBox="0 0 24 24">
                        <path d="M3,3H21V21H3V3M5,5V19H19V5H5M7,7H17V9H7V7M7,11H17V13H7V11M7,15H14V17H7V15Z"/>
                    </svg>
                    Editor de Código
                </h2>
                <textarea id="minecraftCode" placeholder="Ejemplo:&#FB0000&lP&#CC5D02&lW&#9DB904&lA&#76FE0F&lR&#68FB39&lP &#59F862&lM&#49E98F&lA&#37CEBE&lP&#25B3ED&lA&#369BE6&lR&#5385CD&lT&#706EB4&lS "</textarea>
                
                <div class="controls">
                    <button onclick="processCode()">
                        <svg viewBox="0 0 24 24">
                            <path d="M12,16A2,2 0 0,1 14,18A2,2 0 0,1 12,20A2,2 0 0,1 10,18A2,2 0 0,1 12,16M12,10A2,2 0 0,1 14,12A2,2 0 0,1 12,14A2,2 0 0,1 10,12A2,2 0 0,1 12,10M12,4A2,2 0 0,1 14,6A2,2 0 0,1 12,8A2,2 0 0,1 10,6A2,2 0 0,1 12,4Z"/>
                        </svg>
                        Mostrar
                    </button>
                    <button onclick="copyCode()">
                        <svg viewBox="0 0 24 24">
                            <path d="M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z"/>
                        </svg>
                        Copiar
                    </button>
                    <button onclick="resetAll()">
                        <svg viewBox="0 0 24 24">
                            <path d="M12,16A2,2 0 0,1 14,18A2,2 0 0,1 12,20A2,2 0 0,1 10,18A2,2 0 0,1 12,16M12,4A2,2 0 0,1 14,6A2,2 0 0,1 12,8A2,2 0 0,1 10,6A2,2 0 0,1 12,4M12,10A2,2 0 0,1 14,12A2,2 0 0,1 12,14A2,2 0 0,1 10,12A2,2 0 0,1 12,10Z"/>
                        </svg>
                        Resetear
                    </button>
                </div>
                
                <div class="format-info">
                    <h3 class="panel-title">
                        <svg viewBox="0 0 24 24">
                            <path d="M11,9H13V7H11M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M11,17H13V11H11V17Z"/>
                        </svg>
                        Formatos Disponibles
                    </h3>
                    <table class="format-table">
                        <tr>
                            <th>Código</th>
                            <th>Formato</th>
                            <th>Ejemplo</th>
                        </tr>
                        <tr>
                            <td>&k</td>
                            <td>Obfuscated</td>
                            <td><span class="obfuscated">Texto oculto</span></td>
                        </tr>
                        <tr>
                            <td>&l</td>
                            <td>Bold</td>
                            <td><strong>Texto en negrita</strong></td>
                        </tr>
                        <tr>
                            <td>&m</td>
                            <td>Strikethrough</td>
                            <td><span class="strikethrough">Texto tachado</span></td>
                        </tr>
                        <tr>
                            <td>&n</td>
                            <td>Underline</td>
                            <td><span class="underline">Texto subrayado</span></td>
                        </tr>
                        <tr>
                            <td>&o</td>
                            <td>Italic</td>
                            <td><em>Texto en cursiva</em></td>
                        </tr>
                        <tr>
                            <td>&r</td>
                            <td>Reset</td>
                            <td>Texto normal</td>
                        </tr>
                    </table>
                </div>
            </div>
            
            <div class="panel">
                <h2 class="panel-title">
                    <svg viewBox="0 0 24 24">
                        <path d="M12,3L2,12H5V20H19V12H22L12,3M12,7.7L16,11.2V18H14V14H10V18H8V11.2L12,7.7Z"/>
                    </svg>
                    Vista Previa
                </h2>
                <div class="color-display" id="colorResult"></div>
                
                <h3 class="panel-title">
                    <svg viewBox="0 0 24 24">
                        <path d="M9,3V18H12V3H9M12,5L16,18L19,17L15,4L12,5M5,5V18H8V5H5M3,19V21H21V19H3Z"/>
                    </svg>
                    Desglose por Letra
                </h3>
                <div class="letter-grid" id="letterGrid"></div>
            </div>
        </div>
    </div>

    <script>
        // Variables para controlar la animación
        let obfuscationInterval;
        let obfuscatedElements = [];
        
        function processCode() {
            const code = document.getElementById('minecraftCode').value;
            const resultDiv = document.getElementById('colorResult');
            const letterGrid = document.getElementById('letterGrid');
            
            // Limpiar resultados anteriores
            clearInterval(obfuscationInterval);
            obfuscatedElements = [];
            resultDiv.innerHTML = '';
            letterGrid.innerHTML = '';
            
            let currentColor = '#FFFFFF';
            let isBold = false;
            let isObfuscated = false;
            let isStrikethrough = false;
            let isUnderline = false;
            let isItalic = false;
            let lettersProcessed = 0;
            
            function getRandomChar() {
                const chars = "!\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~";
                return chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            function addLetterToGrid(char, color, formats) {
                if (char.trim() === '') return;
                
                const letterBox = document.createElement('div');
                letterBox.className = 'letter-box';
                
                let style = `color: ${color};`;
                if (formats.bold) style += ' font-weight: bold;';
                if (formats.strikethrough) style += ' text-decoration: line-through;';
                if (formats.underline) style += ' text-decoration: underline;';
                if (formats.italic) style += ' font-style: italic;';
                
                letterBox.innerHTML = `
                    <div class="color-preview" style="background-color: ${color};"></div>
                    <div class="letter" style="${style}">${char}</div>
                    <div class="color-code">${color}</div>
                    <div class="color-code">${formatsToText(formats)}</div>
                `;
                
                letterGrid.appendChild(letterBox);
                lettersProcessed++;
            }
            
            function formatsToText(formats) {
                let result = [];
                if (formats.bold) result.push('Negrita');
                if (formats.obfuscated) result.push('Oculto');
                if (formats.strikethrough) result.push('Tachado');
                if (formats.underline) result.push('Subrayado');
                if (formats.italic) result.push('Cursiva');
                return result.join(', ') || 'Normal';
            }
            
            // Procesar cada carácter
            let i = 0;
            while (i < code.length) {
                if (code[i] === '&' || code[i] === '§') {
                    // Desactivar ofuscación al encontrar cualquier &
                    isObfuscated = false;
                    
                    const formatChar = code[i];
                    i++;
                    
                    if (code[i] === '#') {
                        // Código HEX
                        const hexColor = code.substring(i+1, i+7);
                        if (/^[0-9A-Fa-f]{6}$/.test(hexColor)) {
                            currentColor = `#${hexColor}`;
                            i += 7;
                        }
                    } else {
                        // Código clásico
                        const formatCode = code[i].toLowerCase();
                        switch (formatCode) {
                            case '0': currentColor = '#000000'; break;
                            case '1': currentColor = '#0000AA'; break;
                            case '2': currentColor = '#00AA00'; break;
                            case '3': currentColor = '#00AAAA'; break;
                            case '4': currentColor = '#AA0000'; break;
                            case '5': currentColor = '#AA00AA'; break;
                            case '6': currentColor = '#FFAA00'; break;
                            case '7': currentColor = '#AAAAAA'; break;
                            case '8': currentColor = '#555555'; break;
                            case '9': currentColor = '#5555FF'; break;
                            case 'a': currentColor = '#55FF55'; break;
                            case 'b': currentColor = '#55FFFF'; break;
                            case 'c': currentColor = '#FF5555'; break;
                            case 'd': currentColor = '#FF55FF'; break;
                            case 'e': currentColor = '#FFFF55'; break;
                            case 'f': currentColor = '#FFFFFF'; break;
                            case 'k': isObfuscated = true; break;
                            case 'l': isBold = true; break;
                            case 'm': isStrikethrough = true; break;
                            case 'n': isUnderline = true; break;
                            case 'o': isItalic = true; break;
                            case 'r': 
                                currentColor = '#FFFFFF';
                                isBold = false;
                                isStrikethrough = false;
                                isUnderline = false;
                                isItalic = false;
                                break;
                        }
                        i++;
                    }
                } else {
                    // Procesar carácter normal
                    const char = code[i];
                    const span = document.createElement('span');
                    
                    span.style.color = currentColor;
                    if (isBold) span.style.fontWeight = 'bold';
                    if (isObfuscated) {
                        span.classList.add('obfuscated');
                        span.textContent = getRandomChar();
                        obfuscatedElements.push(span);
                    } else {
                        span.textContent = char;
                    }
                    if (isStrikethrough) span.style.textDecoration = 'line-through';
                    if (isUnderline) span.style.textDecoration = 'underline';
                    if (isItalic) span.style.fontStyle = 'italic';
                    
                    resultDiv.appendChild(span);
                    addLetterToGrid(char, currentColor, {
                        bold: isBold,
                        obfuscated: isObfuscated,
                        strikethrough: isStrikethrough,
                        underline: isUnderline,
                        italic: isItalic
                    });
                    
                    i++;
                }
            }
            
            // Iniciar animación de ofuscación
            if (obfuscatedElements.length > 0) {
                obfuscationInterval = setInterval(() => {
                    obfuscatedElements.forEach(el => {
                        el.textContent = getRandomChar();
                    });
                }, 100);
            }
            
            if (lettersProcessed === 0) {
                letterGrid.innerHTML = '<p style="width:100%; text-align:center; color:#aaa;">No se encontraron letras para mostrar</p>';
            }
        }
        
        function copyCode() {
            const code = document.getElementById('minecraftCode');
            code.select();
            document.execCommand('copy');
            
            // Mostrar notificación bonita
            const originalText = code.value;
            code.value = "¡Código copiado al portapapeles!";
            setTimeout(() => {
                code.value = originalText;
            }, 1500);
        }
        
        function resetAll() {
            document.getElementById('minecraftCode').value = '&#0CD7FB&amp;l&amp;oP&#38C1F3&amp;l&amp;oW&#64ABEA&amp;l&amp;oA&#9195E2&amp;l&amp;oR&#BD7FDA&amp;l&amp;oP &#E969D1&amp;l&amp;oM&#F456D1&amp;l&amp;oA&#DE45D9&amp;l&amp;oP&#C835E1&amp;l&amp;oA&#B124E8&amp;l&amp;oR&#9B14F0&amp;l&amp;oT&#8503F8&amp;l&amp;oS';
            document.getElementById('colorResult').innerHTML = '';
            document.getElementById('letterGrid').innerHTML = '';
            clearInterval(obfuscationInterval);
            obfuscatedElements = [];
            
            // Procesar después de un pequeño delay para asegurar que el texto se actualizó
            setTimeout(processCode, 50);
        }
        
        // Iniciar automáticamente al cargar
        document.addEventListener('DOMContentLoaded', function() {
            // Convertir &amp; a & para el procesamiento
            const textarea = document.getElementById('minecraftCode');
            textarea.value = textarea.value.replace(/&amp;/g, '&');
            
            // Procesar el código inicial
            processCode();
            
            // Configurar el evento input para mantener &amp; convertido a &
            textarea.addEventListener('input', function() {
                this.value = this.value.replace(/&amp;/g, '&');
                processCode();
            });
        });
    </script>
</body>
</html>
